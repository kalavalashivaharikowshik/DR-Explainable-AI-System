name: Deploy to Hugging Face Spaces

# Publishes the app to https://huggingface.co/spaces/<your-hf-username>/<HF_SPACE_NAME>
# after the tests pass on main.
#
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Secret   HF_TOKEN        Hugging Face access token with "write" permission (required)
#   Secret   SMTP_USER       Gmail address used to send reports            (optional)
#   Secret   SMTP_PASSWORD   Gmail *app password* for that address          (optional)
#   Variable HF_SPACE_NAME   Space name, default "dr-explainable-ai-system" (optional)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::Skipping deployment: add the HF_TOKEN secret under Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          lfs: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v6
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - if: steps.token.outputs.ok == 'true'
        run: pip install "huggingface_hub>=0.24"

      - name: Upload to Space
        if: steps.token.outputs.ok == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SPACE_NAME: ${{ vars.HF_SPACE_NAME || 'dr-explainable-ai-system' }}
        run: python scripts/deploy_hf_space.py
