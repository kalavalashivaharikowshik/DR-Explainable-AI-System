name: Live site check

# Runs scripts/smoke_test.py against the deployed site.
# Actions -> Live site check -> Run workflow (optionally enter another URL).
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site URL
        default: https://dr-explainable-ai-ab6k.onrender.com
        required: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy opencv-python-headless
      - name: Check the live site
        run: python scripts/smoke_test.py "${{ github.event.inputs.url }}"
